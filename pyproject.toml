[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "clara-exam"
version = "0.1.0"
description = "Protótipo de navegador de avaliações para Windows"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7"]

[project.gui-scripts]
clara-exam = "clara.app:main"

[tool.maturin]
python-source = "src"
module-name = "clara._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
